<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高德车机版一键修复</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 1024 1024" width="26" height="26">
          <rect width="1024" height="1024" rx="230" fill="url(#g)"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2058ff"/><stop offset="1" stop-color="#60a8ff"/>
          </linearGradient></defs>
          <polygon points="512,120 240,750 512,585 784,750" fill="#fff"/>
        </svg>
      </div>
      <div class="titles">
        <h1>高德车机版一键修复</h1>
        <span class="sub">车道级导航 · 沉浸显示 · 车道线放大 · 冥城修复</span>
      </div>
    </div>
    <span class="version" id="verTag">v1.0.2</span>
  </header>

  <main class="content">
    <!-- 步骤 1: 选择文件 -->
    <section class="card">
      <div class="card-head">
        <span class="step-no">1</span>
        <h2>选择安装包</h2>
      </div>
      <div class="dropzone" id="dropzone">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/>
          <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
        <p class="dz-main">拖拽 APK 到此处，或 <a href="#" id="pickBtn">点击选择文件</a></p>
        <p class="dz-sub">支持标准版与共存版（自动识别）</p>
      </div>
      <div class="file-chip" id="fileChip" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
        </svg>
        <span class="file-name" id="fileName"></span>
        <button class="chip-x" id="clearFile" title="移除">&times;</button>
      </div>
    </section>

    <!-- 步骤 2: 选项 -->
    <section class="card">
      <div class="card-head">
        <span class="step-no">2</span>
        <h2>修复选项</h2>
      </div>
      <div class="seg" id="modeSeg">
        <button class="seg-item active" data-mode="auto">自动检测</button>
        <button class="seg-item" data-mode="std">标准版</button>
        <button class="seg-item" data-mode="coexist">共存版</button>
      </div>
      <label class="check-row">
        <input type="checkbox" id="voicePack" checked />
        <span>集成小团团语音包（安装后在语音设置里下载任意语音包，发音即变为小团团）</span>
      </label>
      <label class="check-row">
        <input type="checkbox" id="debugLog" />
        <span>启用应用调试日志（排查问题时使用）</span>
      </label>
    </section>

    <!-- 步骤 3: 执行 -->
    <section class="card">
      <div class="card-head">
        <span class="step-no">3</span>
        <h2>开始修复</h2>
      </div>
      <button class="primary-btn" id="runBtn" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        一键修复
      </button>
      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-text" id="progressText">准备中…</span>
      </div>

      <div class="banner success" id="okBanner" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
        <div class="banner-body">
          <b>修复完成</b>
          <span id="okPath"></span>
        </div>
        <button class="ghost-btn" id="revealBtn">打开所在文件夹</button>
      </div>
      <div class="banner error" id="errBanner" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 8v5m0 3v.5"/>
        </svg>
        <div class="banner-body"><b>修复失败</b><span>请查看下方日志中的 [失败] 项</span></div>
      </div>
    </section>

    <!-- 日志 -->
    <section class="card log-card">
      <div class="card-head">
        <span class="step-no">4</span>
        <h2>执行日志</h2>
        <button class="text-btn" id="clearLog">清空</button>
      </div>
      <div class="terminal" id="terminal">
        <div class="t-line t-dim">就绪。选择 APK 后点击「一键修复」。</div>
      </div>
    </section>
  </main>

  <footer class="foot">
    全部补丁已内置 · 断网可用 · 输出文件与原 APK 同目录（<b>_修复版.apk</b>）
  </footer>

  <script src="app.js"></script>
</body>
</html>
