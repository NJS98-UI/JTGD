name: Build JTGD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build engine.exe (PyInstaller)
        shell: pwsh
        run: |
          pip install pyinstaller
          New-Item -ItemType Directory -Force src-tauri/resources/engine | Out-Null
          pyinstaller --onefile --noconsole --name engine --distpath src-tauri/resources/engine engine/engine.py

      - name: Trim JRE with jlink
        shell: pwsh
        run: |
          & "$env:JAVA_HOME\bin\jlink.exe" `
            --add-modules java.base,java.logging,java.xml,java.desktop,java.naming,java.management `
            --strip-debug --no-man-pages --no-header-files --compress=2 `
            --output src-tauri/resources/jre

      - name: Copy payload
        shell: pwsh
        run: |
          Copy-Item payload/* src-tauri/resources/ -Recurse -Force
          New-Item -ItemType Directory -Force src-tauri/resources/tools | Out-Null

      - name: Collect Android build-tools (zipalign + apksigner)
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not (Test-Path "$sdk/build-tools")) {
            yes | & "$sdk/cmdline-tools/latest/bin/sdkmanager.bat" "build-tools;34.0.0"
          }
          $bt = Get-ChildItem "$sdk/build-tools" -Directory |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          Write-Host "Using build-tools: $($bt.Name)"
          Copy-Item "$($bt.FullName)/zipalign.exe" src-tauri/resources/tools/
          Copy-Item "$($bt.FullName)/lib/apksigner.jar" src-tauri/resources/tools/

      - name: List assembled resources
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/resources -Recurse -File |
            Select-Object @{n='Path';e={$_.FullName.Replace((Get-Location).Path + '\', '')}}, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm i -g @tauri-apps/cli@^2

      - name: Tauri build
        run: npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JTGD-windows
          path: |
            src-tauri/target/release/jtgd.exe
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
