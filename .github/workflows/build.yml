name: Build JTGD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # tools_root = everything the engine needs at runtime (embedded into engine.exe)
      - name: Assemble tools_root
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build_engine/tools_root/tools | Out-Null
          Copy-Item payload/apktool.jar build_engine/tools_root/
          Copy-Item payload/baksmali.jar build_engine/tools_root/
          Copy-Item payload/amapfix.keystore build_engine/tools_root/
          Copy-Item payload/patches build_engine/tools_root/patches -Recurse
          & "$env:JAVA_HOME\bin\jlink.exe" `
            --add-modules java.base,java.logging,java.xml,java.desktop,java.naming,java.management `
            --strip-debug --no-man-pages --no-header-files --compress=2 `
            --output build_engine/tools_root/jre
          $sdk = $env:ANDROID_HOME
          if (-not (Test-Path "$sdk/build-tools")) {
            yes | & "$sdk/cmdline-tools/latest/bin/sdkmanager.bat" "build-tools;34.0.0"
          }
          $bt = Get-ChildItem "$sdk/build-tools" -Directory |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          Write-Host "Using build-tools: $($bt.Name)"
          Copy-Item "$($bt.FullName)/zipalign.exe" build_engine/tools_root/tools/
          Copy-Item "$($bt.FullName)/lib/apksigner.jar" build_engine/tools_root/tools/

      # single self-contained engine.exe (~80MB): Python + JRE + jars + patches + signer
      - name: Build engine.exe (PyInstaller)
        shell: pwsh
        run: |
          pip install pyinstaller
          New-Item -ItemType Directory -Force src-tauri/resources/engine | Out-Null
          pyinstaller --onefile --noconsole --name engine `
            --add-data "build_engine/tools_root;tools_root" `
            --distpath src-tauri/resources/engine engine/engine.py

      - name: Smoke test engine.exe
        shell: pwsh
        run: |
          # engine must report its version even with no APK (proves _MEIPASS extraction works)
          $p = Start-Process -FilePath src-tauri/resources/engine/engine.exe -ArgumentList "--help" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "engine.exe smoke test failed" }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm i -g @tauri-apps/cli@^2

      - name: Tauri build
        run: npx tauri build

      - name: Make portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-portable/JTGD | Out-Null
          Copy-Item src-tauri/target/release/jtgd.exe dist-portable/JTGD/
          Copy-Item src-tauri/resources dist-portable/JTGD/resources -Recurse
          Compress-Archive -Path dist-portable/JTGD -DestinationPath JTGD-portable.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JTGD-windows
          path: |
            JTGD-portable.zip
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            JTGD-portable.zip
            src-tauri/target/release/bundle/nsis/*.exe
